<body>

<div class="toast" id="toast">
PDF criado com sucesso!
</div>

<div class="container">

<h1>CYBER PDF MERGER</h1>

<div class="statusBar">

<span>🟢 root@ca1m</span>

<span>⚡ ONLINE</span>

<span>🛡 SECURE MODE</span>

</div>

<p class="subtitle">
🔒 SECURE PDF TOOL • MADE BY <span class="author">ca1m</span>
</p>

<label class="drop">

📂

<h2>ARRASTE SEUS PDFs AQUI</h2>

<p>ou clique para selecionar</p>

<input
type="file"
id="pdfFiles"
multiple
accept="application/pdf">

</label>

<button onclick="mergePDFs()">

UNIFICAR PDFs

</button>

<div id="list"></div>

<div class="progress">

<div class="bar" id="bar"></div>

</div>

<div class="terminal" id="terminal"></div>

<div class="footer">

🛡 Cyber PDF Suite v1.0

<span>

| Made by ca1m

</span>

</div>

</div>

    <script>

const input=document.getElementById("pdfFiles");

const list=document.getElementById("list");

const terminal=document.getElementById("terminal");

const bar=document.getElementById("bar");

const dropArea = document.querySelector(".drop");

input.onchange=()=>{

list.innerHTML="";

for(let f of input.files){

list.innerHTML+=`<div>✔ ${f.name}</div>`;

}

shell("📂 Detectados "+input.files.length+" PDFs.");

}

function log(text){

const hora=new Date().toLocaleTimeString();

terminal.innerHTML+=`

<div>

<span style="color:#55ff55;">

┌──(root㉿ca1m)-[~/CyberPDF]

</span>

<br>

<span style="color:#00ff80;">

└─$

</span>

${text}

<span class="cursor">█</span>

</div><br>

`;

terminal.scrollTop=terminal.scrollHeight;

}

function toast(msg){

const t=document.getElementById("toast");

t.innerHTML=msg;

t.style.display="block";

setTimeout(()=>{

t.style.display="none";

},3000);

}

function terminalLine(text,color="#00ff80"){

    terminal.innerHTML +=
    `<div style="color:${color};margin:2px 0;">${text}</div>`;

    terminal.scrollTop=terminal.scrollHeight;

}

function shell(text){

    terminal.innerHTML += `
    <div style="margin-top:8px;">
        <span style="color:#66ff66;">
        ┌──(root㉿ca1m)-[~/CyberPDF]
        </span><br>

        <span style="color:#00ff80;">
        └─$
        </span>

        ${text}

        <span class="cursor">█</span>
    </div>
    `;

    terminal.scrollTop=terminal.scrollHeight;

}

async function boot(){

terminal.innerHTML="";

terminalLine("██████╗ ██╗   ██╗██████╗ ");
terminalLine("██╔══██╗╚██╗ ██╔╝██╔══██╗");
terminalLine("██████╔╝ ╚████╔╝ ██║  ██║");
terminalLine("██╔═══╝   ╚██╔╝  ██║  ██║");
terminalLine("██║        ██║   ██████╔╝");
terminalLine("╚═╝        ╚═╝   ╚═════╝ ");

await wait(500);

terminalLine("");

terminalLine("[ OK ] Booting CyberPDF Engine...","#7CFF9A");

await wait(400);

terminalLine("[ OK ] Loading PDF-LIB","#7CFF9A");

await wait(400);

terminalLine("[ OK ] Initializing Memory","#7CFF9A");

await wait(400);

terminalLine("[ OK ] Loading Security Modules","#7CFF9A");

await wait(400);

terminalLine("[ OK ] Loading Merge Engine","#7CFF9A");

await wait(400);

terminalLine("[ OK ] Kernel Loaded","#7CFF9A");

await wait(600);

terminalLine("");

terminalLine("✔ Secure Mode Enabled","#55ff55");

terminalLine("✔ Encryption Active","#55ff55");

terminalLine("✔ Waiting for PDF files...","#55ff55");

terminalLine("");

shell("Engine Ready.");

}

function wait(ms){

return new Promise(resolve=>setTimeout(resolve,ms));

}

boot();

async function mergePDFs(){

const files=input.files;

if(!files.length){

toast("Selecione PDFs.");

return;

}

log("⚙ Inicializando PDF Engine...");

const merged=await PDFLib.PDFDocument.create();

for(let i=0;i<files.length;i++){

log("📄 Processando "+files[i].name);

const buffer=await files[i].arrayBuffer();

const pdf=await PDFLib.PDFDocument.load(buffer);

const pages=await merged.copyPages(pdf,pdf.getPageIndices());

pages.forEach(p=>merged.addPage(p));

bar.style.width=((i+1)/files.length*100)+"%";

}

shell("📄 Processando ...");

shell("🧩 Copiando páginas...");

shell("⚙ Gerando PDF...");

shell("💾 Iniciando Download...");

const bytes=await merged.save();

const blob=new Blob([bytes],{type:"application/pdf"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="PDF_UNIFICADO.pdf";

a.click();

toast("✔ PDF_UNIFICADO.pdf criado com sucesso");

shell("✔ Operação concluída.");

}

    </script>
