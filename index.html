<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber PDF Merger</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%80</text></svg>">

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- Biblioteca PDF -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

</head>

<body>

<canvas id="matrix"></canvas>

<!-- Cursor customizado -->
<div id="cursorRing"></div>
<div id="cursorDot"></div>

<!-- ======= TELA DE LOGIN FALSA ======= -->
<div id="loginScreen">
    <div class="loginBox">
        <h2>&gt; ACESSO RESTRITO_</h2>
        <p>Sistema protegido. Insira a chave de acesso para continuar.</p>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="off">
        <button id="loginBtn">ACESSAR SISTEMA</button>
        <div class="loginStatus" id="loginStatus"></div>
    </div>
</div>
<div id="accessFlash"></div>

<!-- Áudio de fundo (troque "musica.mp3" pelo seu arquivo) -->
<audio id="bgMusic" src="musica.mp3" loop preload="auto"></audio>

<div class="toast" id="toast">
PDF criado com sucesso!
</div>

<div class="container">

<h1>CYBER PDF MERGER</h1>

<div class="statusBar">

<span>🔴 root@ca1m</span>

<span>⚡ ONLINE</span>

<span>🛡 SECURE MODE</span>

<button id="themeBtn">☀️ MODO CLARO</button>

<button id="muteBtn">🔊 SOM</button>

</div>

<p class="subtitle">
🔒 SECURE PDF TOOL • MADE BY <span class="author">ca1m</span>
</p>

<label class="drop">

📂

<h2>ARRASTE SEUS PDFs AQUI</h2>

<p>ou clique para selecionar</p>

<input
type="file"
id="pdfFiles"
multiple
accept="application/pdf">

</label>

<div class="btnRow">

<button onclick="mergePDFs()">UNIFICAR PDFs</button>

<button onclick="generateKey()" class="secondaryBtn">🔑 GERAR CHAVE SEGURA</button>

</div>

<div id="list"></div>

<div class="progress">

<div class="bar" id="bar"></div>

</div>

<div class="terminal" id="terminal"></div>

<div class="footer">

🛡 Cyber PDF Suite v1.0

<span>

| Made by ca1m

</span>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
